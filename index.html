<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Asmetry</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔓</text></svg>" />
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <span class="brand">Lookmaximiser</span>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="lang-switch" role="group" aria-label="Language">
        <button class="lang-btn" data-lang="en">EN</button>
        <button class="lang-btn" data-lang="fr">FR</button>
      </div>
      <h1 data-i18n="heading">Asmetry</h1>
      <p class="subtitle" data-i18n="subtitle"></p>

      <div class="progress" aria-hidden="true">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <p class="progress-label" data-i18n="progressLabel"></p>
    </section>

    <section class="offers" aria-label="Ways to unlock">

      <article class="offer" data-offer="survey1">
        <div class="offer-icon">✎</div>
        <div class="offer-body">
          <h2 data-i18n="offer1"></h2>
        </div>
        <button class="offer-action" data-action="survey" data-stage="start" data-url="https://www.cpx-research.com/"></button>
      </article>

      <article class="offer" data-offer="survey2">
        <div class="offer-icon">✎</div>
        <div class="offer-body">
          <h2 data-i18n="offer2"></h2>
        </div>
        <button class="offer-action" data-action="survey" data-stage="start" data-url="https://bitlabs.ai/"></button>
      </article>

      <article class="offer" data-offer="survey3">
        <div class="offer-icon">✎</div>
        <div class="offer-body">
          <h2 data-i18n="offer3"></h2>
        </div>
        <button class="offer-action" data-action="survey" data-stage="start" data-url="https://www.pollfish.com/"></button>
      </article>

    </section>

    <section class="unlock-section">
      <button class="unlock-button" id="unlockButton" data-stage="locked" disabled></button>
      <p class="fine-print" data-i18n="finePrint"></p>
    </section>
  </main>

  <footer class="footer">
    <p data-i18n="footer"></p>
  </footer>

  <!-- Toast -->
  <div class="toast" id="toast" hidden></div>

  <script src="assets/app.js"></script>
</body>
</html>
